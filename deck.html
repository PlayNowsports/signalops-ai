<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loading Tulip GTM Operations Deck</title>
<style>html,body{height:100%;margin:0;background:#05070a;color:#e8eef7;font-family:Arial,sans-serif}body{display:grid;place-items:center}.status{max-width:680px;padding:32px;text-align:center}.status b{display:block;font-size:22px;margin-bottom:10px}.status span{color:#8a94a6}</style>
</head>
<body>
<div class="status"><b>Loading presentation…</b><span>The restored deck is being opened.</span></div>
<script>
(async()=>{
  try{
    const paths=['deck-payload/part1.txt','deck-payload/part2.txt','deck-payload/part3.txt','deck-payload/part4a.txt','deck-payload/part4b.txt'];
    const parts=await Promise.all(paths.map(async p=>{
      const r=await fetch(p,{cache:'no-store'});
      if(!r.ok) throw new Error(`${p}: ${r.status}`);
      return (await r.text()).trim();
    }));
    const b64=parts.join('');
    const binary=atob(b64);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    if(typeof DecompressionStream==='undefined') throw new Error('This browser does not support gzip decompression.');
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.body.innerHTML=`<div class="status"><b>The presentation could not load.</b><span>${String(error.message||error)}</span></div>`;
    console.error(error);
  }
})();
</script>
</body>
</html>
